name: Release

# Publish a release on GitHub (Releases > Draft a new release, tag like v1.0.0).
# This workflow then builds the installer (ClaudeUsageTray-Setup.exe) and the portable exe,
# attaches both with SHA256 files, and records a build provenance attestation for them.
on:
  release:
    types: [published]

permissions:
  contents: write      # upload files to the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          dotnet publish src/ClaudeUsageTray -p:PublishProfile=win-x64 -p:Version=$version

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          ./installer/build.ps1 -Version $version

      - name: Collect files and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/ClaudeUsageTray/bin/publish/win-x64/ClaudeUsageTray.exe dist/
          Copy-Item installer/Output/ClaudeUsageTray-Setup.exe dist/
          Push-Location dist
          foreach ($f in "ClaudeUsageTray-Setup.exe", "ClaudeUsageTray.exe") {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f" | Out-File "$f.sha256" -Encoding ascii -NoNewline
            "$f SHA256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          Pop-Location

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ClaudeUsageTray-Setup.exe
            dist/ClaudeUsageTray.exe

      - name: Attach files to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            ClaudeUsageTray-Setup.exe ClaudeUsageTray-Setup.exe.sha256 `
            ClaudeUsageTray.exe ClaudeUsageTray.exe.sha256 --clobber
