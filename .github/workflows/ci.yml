name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # Build the exe and the installer too, so a broken installer script shows up before a release.
      - name: Publish
        run: dotnet publish src/ClaudeUsageTray -p:PublishProfile=win-x64

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.0.0
