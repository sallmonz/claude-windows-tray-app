name: Release

# Publish a release on GitHub (Releases > Draft a new release, tag like v1.0.0).
# This workflow then builds ClaudeUsageTray.exe and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          dotnet publish src/ClaudeUsageTray -p:PublishProfile=win-x64 -p:Version=$version

      - name: Attach exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            src/ClaudeUsageTray/bin/publish/win-x64/ClaudeUsageTray.exe --clobber
