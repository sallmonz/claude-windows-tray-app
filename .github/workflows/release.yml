name: Release

# Publish a release on GitHub (Releases > Draft a new release, tag like v1.0.0).
# This workflow then builds ClaudeUsageTray.exe, attaches it with a SHA256 file,
# and records a build provenance attestation that proves it was built here.
on:
  release:
    types: [published]

permissions:
  contents: write      # upload files to the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          dotnet publish src/ClaudeUsageTray -p:PublishProfile=win-x64 -p:Version=$version

      - name: Create SHA256 file
        shell: pwsh
        working-directory: src/ClaudeUsageTray/bin/publish/win-x64
        run: |
          $hash = (Get-FileHash ClaudeUsageTray.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClaudeUsageTray.exe" | Out-File ClaudeUsageTray.exe.sha256 -Encoding ascii -NoNewline
          "SHA256: $hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: src/ClaudeUsageTray/bin/publish/win-x64/ClaudeUsageTray.exe

      - name: Attach files to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: src/ClaudeUsageTray/bin/publish/win-x64
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            ClaudeUsageTray.exe ClaudeUsageTray.exe.sha256 --clobber
